version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres-studs
    environment:
      POSTGRES_DB: studs
      POSTGRES_USER: s408145
      POSTGRES_PASSWORD: "JLzD%6772"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - IS-labs
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U s408145 -d studs"]
      interval: 30s
      timeout: 10s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: "v.amuz@gmail.com"
      PGADMIN_DEFAULT_PASSWORD: "1488"
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "6980:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - IS-labs

volumes:
  postgres_data:
  pgadmin_data:

networks:
  IS-labs:
    driver: bridge
